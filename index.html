<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <!-- フォーム選択時にズームしないように -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
    <title>提出期限管理アプリ（仮）</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="./manifest.webmanifest">
    
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
    
    <!-- バージョン表記（アプリ更新の際に手動で数値を進める） -->
    <meta name="app-version" content="1.0.4">
    <meta name="format-detection" content="telephone=no">

</head>

<body>

    <header>

        <h1 class="header-title">提出期限管理アプリ（仮）</h1>

        <div class="view-menu">
            <button id="currentToggleBtn">≡</button>
    
            <div id="viewDropdown" class="view-dropdown hidden">
                <button data-scope="all">すべて</button>
                <button data-scope="active">実行中</button>
                <button data-scope="archive">アーカイブ</button>
            </div>
        </div>
    </header>

    <main>

        <section class="task-input" id="taskInput">

            <button type="button" class="task-input-toggle" id="taskInputToggle">＋ タスクを追加</button>

            <div class="task-input-body" id="taskInputBody">
                
                <form id="taskForm">
                    
                    <label for="taskTitle">タスク名</label>
                    <input type="text" class="task-title" id="taskTitle" placeholder="タスク名を入力">
                    
                    <label for="coverImage">表示画像（任意）</label>
                    <input type="file" id="coverImage" accept="image/" capture="environment">
                    
                    <label for="taskSubmitTo">提出先（任意）</label>
                    <input type="text" id="taskSubmitTo" placeholder="例： ○○先生 / 総務課 / Moodle">

                    <label for="taskMemo" class="task-memo-label">メモ</label>
                    <textarea rows="3" id="taskMemo" class="task-memo" placeholder="補足メモ"></textarea>

                    <label for="deadlineType">提出期限の指定方法</label>
                    <select id="deadlineType">
                        <option value="exact">日付で指定</option>
                        <option value="rough">おおまか指定</option>
                    </select>

                    
                    <div id="exactDeadlineFields">
                        <label for="taskDeadline">提出期限（日付）</label>
                        <div class="date-input-wrapper">
                            <input type="date" class="task-deadline" id="taskDeadline">
                        </div>
                    </div>
                    
                    <div id="roughDeadlineFields">
                        <label for="taskDeadlineMonth">提出期限（月）</label>
                        <div class="date-input-wrapper">
                            <input type="month" id="taskDeadlineMonth">
                        </div>
                        
                        <label for="taskDeadlinePart">おおまか指定</label>
                        <select id="taskDeadlinePart">
                            <option value="early">上旬</option>
                            <option value="middle">中旬</option>
                            <option value="late">下旬</option>
                        </select>
                    </div>
                    

                    <div class="task-form-actions">
                        <button type="submit" class="task-submit button-pill" id="taskSubmit">タスクを追加</button>
                        <button type="button" class="cancel-edit button-pill" id="cancelEditButton">編集を中止</button>
                    </div>
                </form>
            </div>
        </section>

        <section class="task-list">

            <ul class="task-lists" id="taskLists">

            </ul>
        </section>

        <button id="fabTaskBtn" class="fab-task hidden" aria-label="タスク入力を開く">＋</button>
    </main>

    <footer class="site-footer">
        <p class="footer-copy">
                &copy; Saorui 2025–2026 <span id="appVersion">v0.0.0</span>
        </p>
        <p class="footer-message">
            このアプリが役に立ったら、コーヒー一杯で応援してもらえると嬉しいです。（準備中）
        </p>
        <a href="#" target="_blank" rel="noopener noreferrer" class="coffee-button">
        <span class="coffee-button-icon">☕</span>
        <span class="coffee-button-text">PayPayで応援する</span>
        </a>
    </footer>


    <script src="app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(console.error);
            });
        }
    </script>
</body>

</html>
